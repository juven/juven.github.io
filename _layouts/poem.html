---
layout: default
---
<article class="poem">
  <header class="poem-header">
    <h1 class="poem-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="poem-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  <div class="poem-body">
    {{ content }}
  </div>

  {% if page.date %}
    <footer class="poem-footer">
      <span class="poem-stamp">
        {{ page.date | date: "%Y 年 %-m 月 %-d 日" }}{% if page.place %} · {{ page.place }}{% endif %}
      </span>
    </footer>
  {% endif %}

  <p class="poem-back"><a href="{{ '/poems/' | relative_url }}">← 回到诗的索引</a></p>
</article>
