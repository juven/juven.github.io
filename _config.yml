title: 许晓斌
author: 许晓斌
email: juvenshun@gmail.com
description: >-
  许晓斌的个人主页 / Personal site of Xu Xiaobin.
url: "https://juven.github.io"
baseurl: ""

github_username: juven
lang: zh-CN

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

minima:
  social_links:
    - { platform: github, user_url: "https://github.com/juven" }

header_pages:
  - blog.md
  - poems.md
  - about.md

show_excerpts: true

# excerpt separator (older posts may use <!--more-->)
excerpt_separator: "<!--more-->"

permalink: /:year/:month/:day/:title/

# Collections
collections:
  poems:
    output: true
    permalink: /poems/:name/

defaults:
  - scope:
      path: ""
      type: poems
    values:
      layout: poem
